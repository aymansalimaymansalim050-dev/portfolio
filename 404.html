<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — ayman salim</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found {
      min-height: 70vh;
      display: flex;
      align-items: center;
    }
    .not-found h1 { font-size: var(--step-2xl); margin-bottom: var(--space-4); }
    .not-found p { max-width: 42ch; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="logo">ayman salim</a>
    </div>
  </header>

  <main id="main">
    <section class="not-found">
      <div class="wrap">
        <p class="eyebrow">404</p>
        <h1>This page went for a walk and didn't come back.</h1>
        <p>The link might be broken, or the page may have moved. Let's get you back on track.</p>
        <a href="/" class="btn btn-primary">Back to home</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap status-bar">
      <span class="status-bar-item status-bar-copyright">© 2026 ayman salim</span>
    </div>
  </footer>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
